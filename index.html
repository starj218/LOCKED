<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCKED - 폐쇄된 연구실</title>
<link rel="stylesheet" href="style.css">
<script defer src="game.js"></script>
</head>
<body>
<div id="game">
  <div id="topbar"><div class="brand">LOCKED <span>연구실 탈출 훈련</span></div><div id="objective">목표: 메모를 찾아 보관함 열기</div></div>
  <div id="crosshair">+</div>
  <div id="help"><strong>조작 방법</strong><div>이동: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div><div>점프: <kbd>Space</kbd></div><div>조사: <kbd>E</kbd></div><div>시선: 마우스</div><div class="hint">연구실 입장 후 화면을 클릭하세요.</div></div>
  <div id="interactPrompt" class="hidden">[E] 조사하기</div>
  <div id="message"></div>

  <div id="startScreen" class="screen">
    <div class="panel">
      <p class="eyebrow">SINGLE-PLAYER PRACTICE</p>
      <h1>폐쇄된 연구실</h1>
      <p>단서를 찾고 장치를 작동시켜 잠긴 출구를 여세요.</p>
      <ul><li>WASD로 이동</li><li>Space로 점프</li><li>물건 가까이에서 E를 눌러 조사</li></ul>
      <button id="startButton">연구실 입장</button>
    </div>
  </div>

  <div id="dialog" class="screen hidden">
    <div class="panel dialog-panel">
      <button id="closeDialog" class="close-button">×</button>
      <p class="eyebrow" id="dialogEyebrow">INTERACTION</p>
      <h2 id="dialogTitle">물건 조사</h2>
      <div id="dialogText"></div>
      <div id="dialogActions"></div>
    </div>
  </div>

  <div id="winScreen" class="screen hidden">
    <div class="panel">
      <p class="eyebrow">ESCAPE COMPLETE</p>
      <h1>탈출 성공!</h1>
      <p>연구실의 보안 시스템을 해제했습니다.</p>
      <button id="restartButton">처음부터 다시 하기</button>
    </div>
  </div>
</div>
</body>
</html>
